name: Spark 3 Android verification
on:
  push:
    branches:
      - 'spark3/**'
    paths:
      - 'android-native/**'
      - '.github/workflows/spark3-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run local unit tests
        working-directory: android-native
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK package, privacy and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "com.lamontlabs.spark"
          if "$AAPT" dump permissions "$APK" | grep -F "android.permission.INTERNET"; then
            echo "Unexpected INTERNET permission in offline Spark build" >&2
            exit 1
          fi
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/spark-manifest.txt
          grep -E "allowBackup.*0x0$" /tmp/spark-manifest.txt
      - name: Write APK checksum
        shell: bash
        run: |
          cd android-native/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: spark3-debug-apk
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
