name: Spark 3 Android foundation
on:
  push:
    branches:
      - 'spark3/**'
    paths:
      - 'android-native/**'
      - '.github/workflows/spark3-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: SHA-256
        run: sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: spark3-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
